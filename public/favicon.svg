<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid Black Square Base with 2px border -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#0A0A0A" stroke="#E73520" stroke-width="2"/>
  
  <!-- Subtle Grid Accent inside -->
  <line x1="2" y1="22" x2="62" y2="22" stroke="#222220" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#222220" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Architectural T - Top Bar (Paper White) -->
  <path d="M 12 16 L 52 16 L 52 24 L 12 24 Z" fill="#F7F5EF"/>
  
  <!-- Architectural T - Stem (Paper White) -->
  <path d="M 27 24 L 37 24 L 37 50 L 27 50 Z" fill="#F7F5EF"/>
  
  <!-- Dynamic Trace Path (TRACERA Red Signal) flowing down and around the stem -->
  <path d="M 12 20 L 32 20 L 32 38 L 48 38 L 48 50" fill="none" stroke="#E73520" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- Active Node Signal Dot -->
  <circle cx="48" cy="50" r="3.5" fill="#E73520"/>
  <circle cx="48" cy="50" r="1.5" fill="#FFFFFF"/>
</svg>
